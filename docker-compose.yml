services:
  backend:
    build: ./backend
    env_file: .env
    volumes: ["giftreach_data:/app/data"]
    ports: ["8000:8000"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 30s, timeout: 5s, retries: 3}
  frontend:
    build:
      context: ./frontend
      args: {NEXT_PUBLIC_API_URL: "http://localhost:8000"}
    ports: ["3000:3000"]
    depends_on: {backend: {condition: service_healthy}}
volumes: {giftreach_data: {}}

