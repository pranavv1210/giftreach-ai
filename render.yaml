databases:
  - name: giftreach-db
    databaseName: giftreach
    user: giftreach
    plan: free

services:
  - type: web
    name: giftreach-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_ORIGIN
        value: https://giftreach-ai.vercel.app
      - key: APP_SECRET
        generateValue: true
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: giftreach-db
          property: connectionString
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REDIRECT_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: EMAIL_VERIFICATION_API_KEY
        sync: false